[workspace]
resolver = "2"
members = [
    "crates/supersol-crypto",
    "crates/supersol-core",
    "crates/supersol-runtime",
    "crates/supersol-node",
    "crates/supersol-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
sha2 = "0.10"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
hex = "0.4"
