[workspace]
resolver = "2"
members = [
    "crates/qchain-crypto",
    "crates/qchain-core",
    "crates/qchain-storage",
    "crates/qchain-execution",
    "crates/qchain-governance",
    "crates/qchain-consensus",
    "crates/qchain-simulation",
    "crates/qchain-stark",
    "crates/qchain-network",
    "crates/qchain-node",
    "crates/qchain-cli",
    "crates/qchain-faucet",
    "crates/qchain-wallet",
]
# Built separately for wasm32 (browser self-custody signing). Kept out of the
# workspace so `cargo build --workspace` never unifies its `pure` crypto
# feature with the node's `liboqs` feature (the two backends are mutually
# exclusive). Build it with: cd crates/qchain-wasm && wasm-pack build / cargo build.
exclude = ["crates/qchain-wasm"]

[workspace.package]
version = "4.2.7"
edition = "2021"

# Defense-in-depth for a ledger: catch integer overflow/underflow as a loud
# panic instead of silently wrapping in release builds (Rust's release
# default is to wrap). A wrapped `balance - amount` underflow would mint
# money out of nothing; a wrapped stake/fee sum would corrupt quorum or fee
# logic. Money paths in `qchain-execution` also use explicit `checked_*`
# arithmetic that rejects the offending transaction gracefully (an
# `ExecError`, not a panic) - this profile setting is the backstop for any
# arithmetic site that ISN'T yet guarded, turning a silent-corruption latent
# bug into an immediately-visible crash. `debug-assertions` is deliberately
# left at the release default (off): turning it on would also enable
# Winterfell's debug-only internal trace-consistency `panic!` in production
# (documented in `qchain-stark`), which we do not want. Overhead is
# negligible - the validator's dominant cost is liboqs PQC verification (C
# code, unaffected), not Rust integer ops.
[profile.release]
overflow-checks = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }
sha3 = "0.10"
bs58 = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
oqs = { version = "0.11", default-features = false, features = ["ml_dsa", "sphincs", "vendored", "std"] }
rand = "0.8"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
hex = "0.4"
wasmtime = "27"
wat = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
winterfell = "0.13"
