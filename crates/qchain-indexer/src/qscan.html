<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>QScan — Explorador de Qchain</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
:root{
  --bg:#070b16; --bg2:#0b1122; --card:#0e1630; --card2:#111b3a; --line:#1e2a4d;
  --txt:#e8ecfb; --muted:#8ea0c9; --dim:#5f7099;
  --acc:#8b7bff; --acc2:#5b8cff; --grad:linear-gradient(120deg,#b6a2ff,#6690ff);
  --ok:#38d39f; --warn:#ffb340; --bad:#ff5c7a; --burn:#ff8a3d;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#132049 0,transparent 60%),
             radial-gradient(900px 500px at -10% 10%,#1a1550 0,transparent 55%),var(--bg);
  color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}

/* header */
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:rgba(7,11,22,.82);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:16px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.5px}
.brand svg{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(139,123,255,.5))}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-weight:600;color:var(--dim);font-size:11px;letter-spacing:2px;margin-left:2px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--muted);padding:7px 12px;border-radius:9px;font-weight:600}
nav a:hover{color:var(--txt);background:var(--card2);text-decoration:none}
nav a.on{color:var(--txt);background:var(--card2)}
.searchbar{display:flex;gap:8px;flex:1;min-width:220px;max-width:520px}
.searchbar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:10px 14px;font-size:14px;outline:none}
.searchbar input:focus{border-color:var(--acc)}
.searchbar button{background:var(--grad);border:0;color:#0b0f1e;font-weight:800;
  border-radius:11px;padding:0 16px;cursor:pointer}

/* cards */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(4,1fr);margin:20px 0}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
  border-radius:16px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,123,255,.6),transparent)}
.card.pad{padding:16px 18px}
.stat .k{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding-right:26px}
.stat .v{font-size:22px;font-weight:800;margin-top:4px}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.stat .ic{position:absolute;right:14px;top:14px;opacity:.5}

.cols{grid-template-columns:1fr 1fr;margin-bottom:24px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:15px}
.panel-h a{font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(30,42,77,.55)}
.row:last-child{border-bottom:0}
.badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;
  background:var(--card2);border:1px solid var(--line);color:var(--acc);font-weight:800;flex:none}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.tf{background:rgba(91,140,255,.15);color:#93b4ff}
.pill.dg{background:rgba(56,211,159,.15);color:#5ee7b8}
.pill.ud{background:rgba(255,179,64,.16);color:#ffcf85}
.pill.cl{background:rgba(139,123,255,.16);color:#c3b8ff}
.pill.ub{background:rgba(255,138,61,.16);color:#ffb587}

/* tables */
.card:has(> table){overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:640px;border-collapse:collapse}
th{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;
  padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:12px 14px;border-bottom:1px solid rgba(30,42,77,.5);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(17,27,58,.5)}
.hashlink{max-width:180px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}

/* detail */
.kv{display:grid;grid-template-columns:200px 1fr;gap:0}
.kv>div{padding:13px 18px;border-bottom:1px solid rgba(30,42,77,.5)}
.kv .kk{color:var(--muted);font-weight:600}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv .kk{padding-bottom:0;border-bottom:0}}
h2.title{font-size:20px;margin:22px 0 14px;display:flex;align-items:center;gap:10px}
h2.title::before{content:"";width:5px;height:22px;border-radius:3px;background:var(--grad);box-shadow:0 0 10px rgba(139,123,255,.6)}

.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:14px}
.pager button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:700}
.pager button:disabled{opacity:.4;cursor:default}
.copy{cursor:pointer;color:var(--dim);margin-left:6px}
.copy:hover{color:var(--acc)}
.tag{font-size:11px;color:var(--dim)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--grad)}
footer{color:var(--dim);text-align:center;padding:30px 0;font-size:12px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:12px;font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(56,211,159,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(56,211,159,.5)}70%{box-shadow:0 0 0 7px rgba(56,211,159,0)}100%{box-shadow:0 0 0 0 rgba(56,211,159,0)}}
.banner{margin:14px 0;padding:12px 16px;border-radius:12px;font-weight:600}
.banner.bad{background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.4);color:#ffb0c0}

/* ---- responsive: phones / small tablets ---- */
@media(max-width:820px){
  .wrap{padding:0 12px}
  .hd{flex-wrap:wrap;gap:10px;padding:10px 0}
  .brand{font-size:16px;gap:8px}
  .brand svg{width:26px;height:26px}
  /* brand + nav share the first row, search drops full-width below */
  nav{order:2;margin-left:auto;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:6px 10px;font-size:13px;white-space:nowrap}
  .searchbar{order:3;flex:1 0 100%;max-width:none;min-width:0}
  .searchbar input{font-size:16px;padding:10px 12px} /* 16px avoids iOS zoom-on-focus */
  .searchbar button{padding:0 14px}
  h2.title{font-size:18px;margin:18px 0 12px}
  .stat .v{font-size:20px}
  .card.pad{padding:14px}
  .kv>div{padding:11px 14px}
}
@media(max-width:420px){
  .brand small{display:none} /* keep the header compact on very small phones */
  .stat .v{font-size:19px}
  th,td{padding:10px 11px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="qlogo" viewBox="0 0 64 64">
  <defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6a2ff"/><stop offset="1" stop-color="#6690ff"/></linearGradient></defs>
  <path fill="url(#qg)" fill-rule="evenodd" d="M32 5 54 17.5V42.5L32 55 10 42.5V17.5L32 5Zm0 7L16 21v22l16 9 16-9V21L32 12Z"/>
  <circle cx="32" cy="32" r="9" fill="url(#qg)"/>
  <path d="M37 37 L46 46" stroke="url(#qg)" stroke-width="5" stroke-linecap="round"/>
</symbol></svg>

<header>
 <div class="wrap hd">
  <a class="brand" href="#/"><svg><use href="#qlogo"/></svg><span><b>QSCAN</b><small>QCHAIN</small></span></a>
  <form class="searchbar" onsubmit="return QScan.doSearch(event)">
    <input id="q" placeholder="Buscar por dirección, hash de tx o número de ronda…" autocomplete="off"/>
    <button type="submit">Buscar</button>
  </form>
  <nav id="nav">
    <a href="#/">Inicio</a>
    <a href="#/blocks">Bloques</a>
    <a href="#/txs">Transacciones</a>
    <a href="#/validators">Validadores</a>
    <a href="#/holders">Holders</a>
  </nav>
 </div>
</header>

<main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main>
<footer>QScan · explorador independiente de la red Qchain · lee de un nodo por RPC, no participa del consenso</footer>

<script src="/qscan.js"></script>
</body>
</html>
