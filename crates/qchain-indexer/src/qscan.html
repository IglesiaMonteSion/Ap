<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>QScan — Explorador de Qchain</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --line:#e7eaf3; --line2:#eef1f7;
  --txt:#212a3e; --muted:#6c757d; --dim:#98a0b3;
  --link:#0784c3; --acc:#3b5bdb; --grad:linear-gradient(120deg,#7b8cff,#5f8bff);
  --ok:#00a186; --warn:#d9a400; --bad:#e15b64; --burn:#e07d2f;
  --hero:linear-gradient(102deg,#17255a 0%,#1e5f86 58%,#1f8fa0 100%);
  --shadow:0 2px 8px rgba(20,30,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  background:var(--bg);
  color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1200px;margin:0 auto;padding:0 18px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}

/* header */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(20,30,60,.05)}
.hd{display:flex;align-items:center;gap:16px;padding:11px 0}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.3px;color:var(--txt)}
.brand:hover{text-decoration:none}
.brand svg{width:28px;height:28px}
.brand b{color:var(--txt)}
.brand small{font-weight:700;color:var(--dim);font-size:10px;letter-spacing:2px;margin-left:1px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav a{color:#495468;padding:8px 12px;border-radius:8px;font-weight:600;font-size:13.5px}
nav a:hover{color:var(--acc);background:#f1f3f9;text-decoration:none}
nav a.on{color:var(--acc);background:#eef1fd}
.searchbar{display:flex;gap:8px;flex:1;min-width:220px;max-width:520px}
.searchbar input{flex:1;background:#fff;border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:9px 14px;font-size:14px;outline:none}
.searchbar input::placeholder{color:#aab2c2}
.searchbar input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,91,219,.12)}
.searchbar button{background:var(--acc);border:0;color:#fff;font-weight:700;
  border-radius:10px;padding:0 18px;cursor:pointer;font-size:14px}
.searchbar button:hover{background:#2f49b8}

/* hero */
.hero{background:var(--hero);border-radius:14px;padding:20px 22px;color:#fff;
  margin:20px 0 16px;box-shadow:0 8px 24px rgba(23,37,90,.16)}
.hero h1{margin:0 0 5px;font-size:19px;font-weight:800;letter-spacing:.2px}
.hero .hsub{color:rgba(233,240,255,.82);font-size:13px}

/* stat panel (Etherscan-style divided row) */
.statpanel{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}
.cell{padding:15px 18px;border-right:1px solid var(--line2);min-width:0}
.cell:last-child{border-right:0}
.cell .k{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.cell .v{font-size:20px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:820px){.statpanel{grid-template-columns:repeat(2,1fr)}
  .cell:nth-child(2){border-right:0}.cell:nth-child(1),.cell:nth-child(2){border-bottom:1px solid var(--line2)}}
@media(max-width:460px){.statpanel{grid-template-columns:1fr}
  .cell{border-right:0;border-bottom:1px solid var(--line2)}.cell:last-child{border-bottom:0}}

/* cards / grids */
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,1fr);margin:20px 0}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  position:relative;overflow:hidden}
.card.pad{padding:16px 18px}
.stat .k{color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding-right:26px}
.stat .v{font-size:22px;font-weight:800;margin-top:4px}
.stat .s{color:var(--muted);font-size:12px;margin-top:2px}
.stat .ic{position:absolute;right:14px;top:14px;opacity:.6}

.cols{grid-template-columns:1fr 1fr;margin-bottom:24px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:14.5px;font-weight:700}
.panel-h a{font-size:12px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
  background:#f2f5fb;border:1px solid var(--line);color:var(--acc);font-weight:800;flex:none}
.pill{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.2px}
.pill.tf{background:#e7f0ff;color:#1b6ec2}
.pill.dg{background:#e3f7ef;color:#0a8f6a}
.pill.ud{background:#fff3e0;color:#c07717}
.pill.cl{background:#eee9fd;color:#6a4fce}
.pill.ub{background:#fdecdf;color:#c4631c}

/* tables */
.card:has(> table){overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:640px;border-collapse:collapse}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;
  padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;background:#fafbfd}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f7f9fc}
.hashlink{max-width:180px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}

/* detail */
.kv{display:grid;grid-template-columns:210px 1fr;gap:0}
.kv>div{padding:13px 18px;border-bottom:1px solid var(--line2)}
.kv .kk{color:var(--muted);font-weight:600}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv .kk{padding-bottom:0;border-bottom:0}}
h2.title{font-size:19px;margin:22px 0 14px;display:flex;align-items:center;gap:10px;font-weight:800}
h2.title::before{content:"";width:4px;height:20px;border-radius:3px;background:var(--acc)}

.pager{display:flex;gap:6px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}
.pager button{background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}
.pager button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.pager button:disabled{opacity:.45;cursor:default}
.copy{cursor:pointer;color:var(--dim);margin-left:6px;user-select:none}
.copy:hover{color:var(--acc)}
.copy.ok{color:var(--ok)}
.tag{font-size:11px;color:var(--dim)}
.empty{padding:34px;text-align:center;color:var(--muted)}
/* long unbreakable strings (hashes, roots) must wrap, never widen the page */
main .center{overflow-wrap:anywhere}
.note{max-width:720px;margin-left:auto;margin-right:auto;line-height:1.6;font-size:13px}
.bar{height:6px;border-radius:4px;background:#eef1f7;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--acc)}
footer{color:var(--dim);text-align:center;padding:30px 0;font-size:12px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:12px;font-weight:700}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(0,161,134,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,161,134,.45)}70%{box-shadow:0 0 0 7px rgba(0,161,134,0)}100%{box-shadow:0 0 0 0 rgba(0,161,134,0)}}
.banner{margin:14px 0;padding:12px 16px;border-radius:10px;font-weight:600}
.banner.bad{background:#fdeced;border:1px solid #f6c9cc;color:#b23b43}

/* ---- responsive: phones / small tablets ---- */
@media(max-width:820px){
  .wrap{padding:0 12px}
  .hd{flex-wrap:wrap;gap:11px;padding:10px 0}
  .brand{font-size:16px;gap:8px;order:0}
  .brand svg{width:25px;height:25px}
  /* search FIRST (primary action), full width, input shrinks so the button always fits */
  .searchbar{order:1;flex:1 0 100%;max-width:none;min-width:0;gap:8px}
  .searchbar input{font-size:16px;padding:11px 13px;min-width:0} /* 16px avoids iOS zoom-on-focus */
  .searchbar button{flex:0 0 auto;padding:0 16px;min-height:44px}
  /* nav as a full-width segmented scroller (reads as a control, never as page overflow) */
  nav{order:2;width:100%;margin-left:0;gap:4px;flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;background:#eef1f7;
    border:1px solid var(--line);border-radius:12px;padding:4px}
  nav::-webkit-scrollbar{display:none}
  nav a{flex:0 0 auto;padding:9px 13px;font-size:13.5px;white-space:nowrap;border-radius:9px;
    min-height:40px;display:flex;align-items:center;color:#475069}
  nav a.on{background:#fff;color:var(--acc);box-shadow:0 1px 3px rgba(20,30,60,.12)}
  nav a:hover{background:transparent}
  .hero{padding:16px 16px;margin:16px 0 14px}
  .hero h1{font-size:17px}
  h2.title{font-size:18px;margin:18px 0 12px}
  .card.pad{padding:14px}
  .kv>div{padding:11px 14px}
}
@media(max-width:420px){
  .brand small{display:none}
  th,td{padding:10px 11px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="qlogo" viewBox="0 0 64 64">
  <defs><linearGradient id="qg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b8cff"/><stop offset="1" stop-color="#3b5bdb"/></linearGradient></defs>
  <path fill="url(#qg)" fill-rule="evenodd" d="M32 5 54 17.5V42.5L32 55 10 42.5V17.5L32 5Zm0 7L16 21v22l16 9 16-9V21L32 12Z"/>
  <circle cx="32" cy="32" r="9" fill="url(#qg)"/>
  <path d="M37 37 L46 46" stroke="url(#qg)" stroke-width="5" stroke-linecap="round"/>
</symbol></svg>

<header>
 <div class="wrap hd">
  <a class="brand" href="#/"><svg><use href="#qlogo"/></svg><span><b>QSCAN</b><small>QCHAIN</small></span></a>
  <form class="searchbar" onsubmit="return QScan.doSearch(event)">
    <input id="q" placeholder="Buscar por dirección, hash o ronda…" autocomplete="off"/>
    <button type="submit">Buscar</button>
  </form>
  <nav id="nav">
    <a href="#/">Inicio</a>
    <a href="#/blocks">Bloques</a>
    <a href="#/txs">Transacciones</a>
    <a href="#/validators">Validadores</a>
    <a href="#/holders">Holders</a>
  </nav>
 </div>
</header>

<main class="wrap" id="app"><div class="empty"><span class="spin"></span></div></main>
<footer>QScan · explorador independiente de la red Qchain · lee de un nodo por RPC, no participa del consenso</footer>

<script src="/qscan.js"></script>
</body>
</html>
