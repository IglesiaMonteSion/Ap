[package]
name = "qchain-crypto"
version.workspace = true
edition.workspace = true

[features]
# Which ML-DSA-65 / SLH-DSA backend to compile. The validator node uses
# `liboqs` (default); the browser/WASM wallet uses `pure` (RustCrypto ml-dsa,
# no C, compiles to wasm32). Exactly one must be enabled.
default = ["liboqs"]
liboqs = ["dep:oqs", "dep:rand"]
pure = ["dep:ml-dsa"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
borsh.workspace = true
ed25519-dalek.workspace = true
bs58.workspace = true
anyhow.workspace = true
hex.workspace = true
sha3.workspace = true
# Borrado seguro de material secreto de la memoria (QCH-3.1, tarea #188).
# Compatible con wasm32 (el backend `pure` del navegador).
zeroize = "1"
oqs = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"], optional = true }

# KM#8 — Keystore V2 (cifrado en reposo del keypair del validador/operador),
# NODE-ONLY (no wasm32: la wallet del navegador cifra en JS). Cero third-party
# nuevo — argon2 y chacha20poly1305 ya están en el lock (los usan
# qchain-wallet/qchain-wasm y qchain-network); getrandom ya está transitivo.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
argon2 = "0.5"
chacha20poly1305.workspace = true
getrandom = "0.2"

[dev-dependencies]
# Native cross-check of the pure backend against liboqs (tests/wasm_feasibility.rs);
# default features here (incl. getrandom) are fine on the native test target.
ml-dsa = "0.1"
