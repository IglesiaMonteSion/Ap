[package]
name = "qchain-remote-signer"
version.workspace = true
edition.workspace = true

# Firmante remoto / HSM de la clave de validador (tarea #193, separación de
# claves + firmante remoto). La `lib` da el CLIENTE (`RemoteSigner`, que impl
# `qchain_crypto::Signer`) y el SERVIDOR (`serve` + `DoubleSignGuard`); el `bin`
# es el daemon que sostiene la clave y firma por socket, para que la clave que
# firma bloques NO viva en el proceso del nodo (la superficie expuesta a
# internet). Usa el backend liboqs de qchain-crypto, igual que el nodo.

[lib]
name = "qchain_remote_signer"
path = "src/lib.rs"

[[bin]]
name = "qchain-remote-signer"
path = "src/bin/qchain-remote-signer.rs"

[dependencies]
qchain-crypto = { path = "../qchain-crypto" }
# #4 (auditoría v8.6.13): el daemon deserializa el Vertex para verificar la
# AUTORÍA de un peer-vote y rehusar un auto-voto enrutado por SignPeerVote (cierra
# el bypass de auto-equivocación). Sin ciclo: qchain-remote-signer → qchain-core →
# qchain-crypto (qchain-core no depende de qchain-remote-signer).
qchain-core = { path = "../qchain-core" }
borsh.workspace = true
# #4.2 (auditoría v8.6.13): autenticación del cliente del socket por
# challenge-response de token pre-compartido — el servidor manda un nonce fresco
# (getrandom) y el cliente prueba conocer el token con un tag SHA3-256; cierra el
# "cualquier proceso local puede pedir firmas sin autenticarse".
getrandom = "0.2"
sha3.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
