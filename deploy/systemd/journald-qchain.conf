# journald size limits for qchain hosts (task #199, QCH-S14).
#
# The qchain services (validator/faucet/indexer/wallet) run as `docker run`
# under systemd Type=simple, so their stdout/stderr go to the systemd JOURNAL.
# Without a cap, a chatty node (or a log-spamming attack) can fill the disk with
# journal files - the "logrotate" concern for journald-logged services is really
# bounding the journal's total size. This drop-in caps it system-wide.
#
# Installed by `deploy/install-limits.sh` into
# /etc/systemd/journald.conf.d/qchain.conf (a drop-in, so it doesn't overwrite
# the distro's journald.conf). Values are generous; raise them if you keep more
# history. File-based logs (install.log, monitor/backup) are handled separately
# by the logrotate config in deploy/logrotate/qchain.
[Journal]
# Hard ceiling on total persistent journal size (across all units on the box).
SystemMaxUse=500M
# Always leave at least this much free on the journal's filesystem.
SystemKeepFree=1G
# Cap a single journal file so rotation happens in reasonable chunks.
SystemMaxFileSize=50M
# Drop entries older than this even if under the size cap.
MaxRetentionSec=1month
# Rate-limit a single service to blunt a log-spam flood (burst then throttle).
RateLimitIntervalSec=30s
RateLimitBurst=10000
