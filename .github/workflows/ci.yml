name: CI de seguridad

# Corre en cada push y pull request. La suite de tests del workspace ya incluye
# el arsenal de seguridad de este proyecto — el DST de consenso (9/9, prueba
# safety+liveness bajo pérdida de certificados y un validador equivocador), los
# ataques WASM (acuñación/robo en el borde del ledger, memory-bomb, bypass de
# gas), la soundness del STARK/Merkle, y todas las regresiones de seguridad
# documentadas — así que correrlos en CI convierte "no romper seguridad" en algo
# automático en vez de manual.

on:
  push:
  pull_request:
  # Los jobs PESADOS (fuzzing, sanitizers) corren de noche y a demanda, NO en
  # cada push — son caros y lentos. El gate rápido (build/clippy/tests/audit/sbom)
  # sigue corriendo en cada push/PR.
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC todos los días
  workflow_dispatch:

# Menor privilegio para el GITHUB_TOKEN: estos jobs sólo compilan/testean, no
# escriben nada al repo ni usan secrets. (QCH-CI: defensa-en-profundidad contra
# un build.rs/test de un PR que intente usar un token con permisos amplios.)
permissions:
  contents: read

# Cancela una corrida vieja del mismo ref si llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # overflow-checks=true ya está en el perfil release del proyecto; en CI
  # corremos debug (los tests), que también los tiene por defecto.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + clippy + tests (incl. DST y ataques WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # liboqs (firmas post-cuánticas) se compila desde fuente vía la crate oqs:
      # necesita cmake + un compilador C/C++, y bindgen necesita libclang.
      - name: Dependencias de sistema (liboqs / bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config

      - name: Toolchain de Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch pinned
        with:
          components: clippy

      # Cachea el registro de cargo + target para que las corridas siguientes no
      # recompilen liboqs/Winterfell desde cero.
      - name: Caché de cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Build reproducible desde el Cargo.lock committeado (falla ruidoso si el
      # lock quedó inconsistente, en vez de re-resolver a otra versión).
      - name: Build (--locked)
        run: cargo build --workspace --locked

      # clippy como puerta: cualquier warning nuevo tumba el CI.
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # La suite completa: incluye el DST de consenso, los tests adversariales de
      # WASM, la soundness del STARK y todas las regresiones de seguridad.
      - name: Tests del workspace
        run: cargo test --workspace --locked

  sdk:
    name: SDK de contratos (qchain-sdk + templates a wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # qchain-sdk y las plantillas de contrato están EXCLUIDAS del workspace
    # (targetean wasm32/no_std), así que `cargo test --workspace` NUNCA las
    # compila. Sin este job, un cambio a la capa de seguridad del SDK o a una
    # plantilla que rompa la compilación (o el fix anti init-takeover de la
    # bóveda) pasaría el CI sin ser detectado. Este job cierra ese hueco:
    # compila el SDK y CADA plantilla a wasm32 + clippy como puerta.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain de Rust (stable + clippy + target wasm32)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch pinned
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Caché de cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            crates/qchain-sdk
            crates/qchain-sdk/templates/token
            crates/qchain-sdk/templates/vault
            crates/qchain-sdk/templates/payments
            crates/qchain-sdk/templates/counter
            crates/qchain-sdk/templates/shared_counter
            crates/qchain-sdk/templates/escrow
      # El SDK es no_std + sin dependencias (sólo `core` + los syscalls del host):
      # compila a wasm32 Y en host (stubs inertes para que clippy corra).
      - name: Clippy qchain-sdk (host, -D warnings)
        run: cargo clippy --manifest-path crates/qchain-sdk/Cargo.toml --all-targets -- -D warnings
      - name: Clippy qchain-sdk (wasm32, -D warnings)
        run: cargo clippy --manifest-path crates/qchain-sdk/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # Tests de HOST de las funciones puras del SDK (LE read/write, aritmética
      # overflow-safe add/sub/mul/div, guardas financieras require_at_least/at_most,
      # holder_seed). Corren en host (no wasm32) porque necesitan el test harness.
      - name: Tests del SDK (host)
        run: cargo test --manifest-path crates/qchain-sdk/Cargo.toml
      - name: Build del SDK a wasm32
        run: cargo build --manifest-path crates/qchain-sdk/Cargo.toml --release --target wasm32-unknown-unknown
      # Cada plantilla de ejemplo DEBE compilar a wasm32 — así el fix anti
      # init-takeover de la bóveda (require_deployer en init), la plantilla
      # financiera `escrow` (guardas require_at_most + mul_u64) y toda la capa de
      # seguridad del SDK quedan bajo CI.
      - name: Build de cada plantilla de contrato a wasm32
        run: |
          set -e
          for t in token vault payments counter shared_counter escrow; do
            echo "==> compilando plantilla $t"
            cargo build --manifest-path "crates/qchain-sdk/templates/$t/Cargo.toml" \
              --release --target wasm32-unknown-unknown
          done

  audit:
    name: cargo-audit (advisories de dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch pinned
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked
      # Escanea el Cargo.lock contra la base de advisories de RustSec (RUSTSEC).
      # Falla si hay una vulnerabilidad conocida en una dependencia.
      - name: cargo audit
        run: cargo audit

  sbom:
    name: SBOM CycloneDX (inventario de dependencias)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # gen-sbom.sh deriva el SBOM SOLO del Cargo.lock committeado (determinista,
      # sin toolchain de Rust ni red), así que es rápido y reproducible.
      - name: Generar SBOM
        run: bash deploy/gen-sbom.sh -o sbom.cdx.json
      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qchain-sbom-cyclonedx
          path: sbom.cdx.json

  fuzz:
    name: Fuzzing (cargo-fuzz, nightly/manual)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Sólo de noche o a demanda: coverage-guided fuzzing es caro. Ejercita los
    # deserializadores del wire (transaction/message) — ningún byte arbitrario
    # debe panicar/OOM el nodo. El crate `fuzz/` está EXCLUIDO del workspace y
    # necesita nightly + cargo-fuzz.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependencias de sistema (liboqs / bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config
      - name: Toolchain nightly (cargo-fuzz requiere nightly)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch pinned
        with:
          toolchain: nightly
      - name: Caché de cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Instalar cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # Cada target corre un tiempo ACOTADO (120s). Un crash deja un artefacto
      # reproducible que tumba el job. Para una campaña larga, subir el tiempo.
      - name: Fuzz transaction_deserialize (120s)
        run: cargo +nightly fuzz run transaction_deserialize -- -max_total_time=120
      - name: Fuzz message_deserialize (120s)
        run: cargo +nightly fuzz run message_deserialize -- -max_total_time=120

  sanitizers:
    name: Sanitizers (ASan/UBSan sobre los deserializadores, nightly/manual)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Sólo de noche o a demanda. AddressSanitizer + UndefinedBehaviorSanitizer
    # sobre los tests de los crates de wire PUROS-Rust (core/storage/stark) —
    # los que deserializan bytes no confiables. LÍMITE HONESTO: un sanitizer
    # sobre el workspace COMPLETO tropieza con el liboqs en C (firmas PQC), cuyo
    # análisis de canal lateral/memory-safety es un proceso externo aparte (#185);
    # por eso se acota a los crates que no linkean liboqs en su test path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain nightly + rust-src (sanitizers requieren nightly)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch pinned
        with:
          toolchain: nightly
          components: rust-src
      - name: Caché de cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Tests bajo AddressSanitizer (core/storage/stark)
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p qchain-core -p qchain-storage -p qchain-stark
      - name: Tests bajo UndefinedBehaviorSanitizer (core/storage/stark)
        env:
          RUSTFLAGS: "-Zsanitizer=undefined"
          RUSTDOCFLAGS: "-Zsanitizer=undefined"
        run: |
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p qchain-core -p qchain-storage -p qchain-stark

  reproducible:
    name: Build reproducible (dos builds -> hashes idénticos)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Sólo de noche o a demanda (compila release dos veces). Con el toolchain
    # pinneado + Cargo.lock + --locked + SOURCE_DATE_EPOCH, dos builds del MISMO
    # commit deben producir binarios con el MISMO sha256. Si difieren, el build
    # no es reproducible y el job falla (así el hash de la provenance es una
    # promesa verificable, no una foto de una sola corrida).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependencias de sistema (liboqs / bindgen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config
      - name: Toolchain de Rust (pinneado por rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch pinned
      - name: Build A (release, --locked, SOURCE_DATE_EPOCH fijo)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          cargo build --locked --release \
            -p qchain-node -p qchain-cli -p qchain-faucet -p qchain-wallet -p qchain-indexer -p qchain-remote-signer
          mkdir -p /tmp/buildA
          cp target/release/qchain-node target/release/qchain target/release/qchain-genesis-build \
             target/release/qchain-faucet target/release/qchain-wallet target/release/qchain-indexer \
             target/release/qchain-remote-signer /tmp/buildA/
          (cd /tmp/buildA && sha256sum * > SHA256SUMS)
          cat /tmp/buildA/SHA256SUMS
      - name: Build B (limpio, mismo SOURCE_DATE_EPOCH)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          cargo clean
          cargo build --locked --release \
            -p qchain-node -p qchain-cli -p qchain-faucet -p qchain-wallet -p qchain-indexer -p qchain-remote-signer
          mkdir -p /tmp/buildB
          cp target/release/qchain-node target/release/qchain target/release/qchain-genesis-build \
             target/release/qchain-faucet target/release/qchain-wallet target/release/qchain-indexer \
             target/release/qchain-remote-signer /tmp/buildB/
          (cd /tmp/buildB && sha256sum * > SHA256SUMS)
      - name: Comparar hashes A vs B
        run: |
          echo "== A =="; cat /tmp/buildA/SHA256SUMS
          echo "== B =="; cat /tmp/buildB/SHA256SUMS
          diff /tmp/buildA/SHA256SUMS /tmp/buildB/SHA256SUMS \
            && echo "OK: build reproducible (hashes idénticos en dos corridas)" \
            || { echo "FALLO: los binarios NO son bit-idénticos entre dos builds"; exit 1; }
