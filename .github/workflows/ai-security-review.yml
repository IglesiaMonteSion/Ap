# AI security review of each pull request — tarea #183, Fase A (dev-time auditor).
#
# Advisory only: it posts a comment with findings, it NEVER gates the PR.
# INERT until you add the `ANTHROPIC_API_KEY` repo secret (Settings → Secrets and
# variables → Actions). Without that secret the job runs and exits cleanly having
# done nothing. Read-only over code; holds no keys in the repo; the worst case if
# it misbehaves is a wrong comment. See docs/AI-SECURITY-REVIEW.md.
name: AI security review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: read the code, write PR comments. Nothing else.
permissions:
  contents: read
  pull-requests: write

# One review per PR at a time; a new push cancels the in-flight one.
concurrency:
  group: ai-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so we can diff against the base)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI security review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Overridable model id for the API call (a balanced default for a
          # frequent per-PR auditor). Not this project's own model identity.
          CLAUDE_MODEL: claude-sonnet-5
        run: python3 .github/scripts/ai_security_review.py
